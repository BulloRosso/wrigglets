# Local environment on Docker Desktop. Start with `pnpm stack:up` (or `node scripts/stack.mjs up`),
# which creates .env with fresh secrets, builds all images (including the agent image that the
# admin console uses to spin up agents) and starts this stack.
#
#   http://${PUBLIC_HOST:-localhost}:8080  admin console (in the "temporal" container)
#   http://${PUBLIC_HOST:-localhost}:8233  Temporal Web UI
#   http://${PUBLIC_HOST:-localhost}:9000  OAuth / OpenID Connect server
#   http://${PUBLIC_HOST:-localhost}:81xx  agents (created from the admin console)
#   http://${PUBLIC_HOST:-localhost}:4000  LiteLLM (AI gateway; admin UI at /ui, master key in .env)
#
# Internal only: mcp-gateway (7400), mcp-demo (7500), mcp-web (7600, internet access), keyvault (Lowkey Vault, 8443 TLS + 8080 token endpoint),
# litellm-db (PostgreSQL for LiteLLM keys and spend).
#
# The AI model is always real: LiteLLM calls the OpenAI API with OPENAI_API_KEY from the machine's environment.

name: coworking

x-build: &build
  context: .
  dockerfile: infra/docker/Dockerfile

services:
  temporal:
    build: { <<: *build, target: control-plane }
    image: coworking/control-plane:local
    container_name: cw-temporal
    hostname: temporal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # admin console
      - "127.0.0.1:8233:8233" # Temporal Web UI
      - "127.0.0.1:7233:7233" # Temporal gRPC (CLI access from the host)
    volumes:
      - control-plane-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - keyvault-certs:/certs:ro
    depends_on:
      keyvault: { condition: service_started }
    environment:
      PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:8080
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-agent-dev}
      TEMPORAL_UI_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:8233
      PAYLOAD_CODEC_KEYS: ${PAYLOAD_CODEC_KEYS:?run scripts/stack.mjs to create .env}
      OAUTH_ISSUER: http://${PUBLIC_HOST:-localhost}:9000
      OAUTH_INTERNAL_URL: http://oauth:9000
      OAUTH_ADMIN_TOKEN: ${OAUTH_ADMIN_TOKEN:?}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET:?}
      SESSION_SECRET: ${ADMIN_SESSION_SECRET:?}
      DOCKER_NETWORK: coworking
      AGENT_PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      AGENT_IMAGE: ${AGENT_IMAGE:-coworking/agent:local}
      AGENT_TEMPORAL_ADDRESS: temporal:7233
      AGENT_OIDC_INTERNAL_URL: http://oauth:9000
      # AI gateway = LiteLLM; agents get virtual keys with a USD spend limit (ADR-0029)
      LITELLM_URL: http://litellm:4000
      LITELLM_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:4000
      LITELLM_MASTER_KEY: ${CW_LITELLM_MASTER_KEY:?run scripts/stack.mjs env to add CW_LITELLM_MASTER_KEY}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-gpt-5.4-mini}
      AI_GATEWAY_SMALL_MODEL: ${AI_GATEWAY_SMALL_MODEL:-gpt-5.4-nano}
      AGENT_SPEND_LIMIT_USD: ${AGENT_SPEND_LIMIT_USD:-25}
      APPROVAL_REMINDER_AFTER: ${APPROVAL_REMINDER_AFTER:-4h}
      APPROVAL_EXPIRE_AFTER: ${APPROVAL_EXPIRE_AFTER:-7d}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?run scripts/stack.mjs to add GATEWAY_TOKEN}
      MCP_GATEWAY_URL: http://mcp-gateway:7400
      AGENT_CONTROL_PLANE_URL: http://temporal:8080
      DEMO_UPSTREAM_URL: http://mcp-demo:7500/mcp
      MCP_DEMO_TOKEN: ${MCP_DEMO_TOKEN:?}
      WEB_UPSTREAM_URL: http://mcp-web:7600/mcp
      MCP_WEB_TOKEN: ${MCP_WEB_TOKEN:?run scripts/stack.mjs env to add MCP_WEB_TOKEN}
      # Agent portraits (taken from the host environment, never written to .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Human in the loop: mail API (POST {to[], subject, body}); empty = mails only in /data/mail_out
      MAIL_API_URL: ${MAIL_API_URL:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      KEYVAULT_URL: https://keyvault:8443
      KEYVAULT_EMULATOR: "true"
      AZURE_POD_IDENTITY_AUTHORITY_HOST: http://keyvault:8080
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [coworking]

  oauth:
    build: { <<: *build, target: oauth }
    image: coworking/oauth:local
    container_name: cw-oauth
    hostname: oauth
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - oauth-data:/data
    environment:
      OAUTH_ISSUER: http://${PUBLIC_HOST:-localhost}:9000
      OAUTH_ADMIN_TOKEN: ${OAUTH_ADMIN_TOKEN:?}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET:?}
      ADMIN_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:8080
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Welcome-2026!}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [coworking]

  # AI gateway: LiteLLM 1.102.0 (pinned by digest; same image as ghcr.io/berriai/litellm:v1.102.0)
  litellm:
    image: litellm/litellm:v1.102.0@sha256:32cfd7a427f6470033b4dcc9e75dfbea2aa32dbc298b0b511a40e962ce818362
    container_name: cw-litellm
    hostname: litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${CW_LITELLM_MASTER_KEY:?}
      LITELLM_SALT_KEY: ${CW_LITELLM_SALT_KEY:?}
      DATABASE_URL: postgresql://litellm:${CW_LITELLM_DB_PASSWORD:?}@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "False"
      # current prices: fetch LiteLLM's maintained model cost map at startup
      LITELLM_LOCAL_MODEL_COST_MAP: "False"
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
    depends_on:
      litellm-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 60s
    networks: [coworking]

  litellm-db:
    image: postgres:17.6-alpine
    container_name: cw-litellm-db
    hostname: litellm-db
    restart: unless-stopped
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${CW_LITELLM_DB_PASSWORD:?}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [coworking]

  mcp-gateway:
    build: { <<: *build, target: mcp-gateway }
    image: coworking/mcp-gateway:local
    container_name: cw-mcp-gateway
    hostname: mcp-gateway
    restart: unless-stopped
    volumes:
      - mcp-gateway-data:/data
      - keyvault-certs:/certs:ro
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?}
      CONTROL_PLANE_URL: http://temporal:8080
      KEYVAULT_URL: https://keyvault:8443
      KEYVAULT_EMULATOR: "true"
      AZURE_POD_IDENTITY_AUTHORITY_HOST: http://keyvault:8080
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      keyvault: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7400/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [coworking]

  mcp-demo:
    build: { <<: *build, target: mcp-demo }
    image: coworking/mcp-demo:local
    container_name: cw-mcp-demo
    hostname: mcp-demo
    restart: unless-stopped
    environment:
      DEMO_TOKEN: ${MCP_DEMO_TOKEN:?}
    networks: [coworking]

  # Internet access for agents as an MCP upstream behind the gateway (search + reading public pages, ADR-0031).
  # The only container with outbound web access for agents; private and internal addresses are refused.
  mcp-web:
    build: { <<: *build, target: mcp-web }
    image: coworking/mcp-web:local
    container_name: cw-mcp-web
    hostname: mcp-web
    restart: unless-stopped
    environment:
      WEB_TOKEN: ${MCP_WEB_TOKEN:?}
    networks: [coworking]

  # Azure Key Vault emulator (ADR-0024). TLS with a local CA created by keyvault-certs.
  keyvault-certs:
    image: alpine:3.22
    container_name: cw-keyvault-certs
    volumes:
      - keyvault-certs:/certs
      - ./infra/keyvault/gen-certs.sh:/gen-certs.sh:ro
    command: ["sh", "/gen-certs.sh"]
    restart: "no"

  keyvault:
    image: nagyesta/lowkey-vault:7.3.127
    container_name: cw-keyvault
    hostname: keyvault
    restart: unless-stopped
    volumes:
      - keyvault-certs:/certs:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec java -jar /lowkey-vault.jar
        --server.ssl.key-store=/certs/keyvault.p12
        --server.ssl.key-store-type=PKCS12
        --server.ssl.key-store-password="$$(cat /certs/keyvault.pass)"
        --LOWKEY_VAULT_RELAXED_PORTS=true
        "--LOWKEY_VAULT_ALIASES=localhost=keyvault:<port>"
    depends_on:
      keyvault-certs: { condition: service_completed_successfully }
    networks: [coworking]

  # Not started: only built so that the admin console can create agent containers from it.
  agent-image:
    build: { <<: *build, target: agent }
    image: ${AGENT_IMAGE:-coworking/agent:local}
    profiles: ["build"]

networks:
  coworking:
    name: coworking

volumes:
  control-plane-data:
  oauth-data:
  mcp-gateway-data:
  keyvault-certs:
  litellm-db-data:
