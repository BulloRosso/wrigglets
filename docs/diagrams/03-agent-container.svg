<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <title>Agent container internals</title>
  <style>
    .t { font-size: 22px; font-weight: 600; fill: #1d2733; }
    .st { font-size: 13px; fill: #5b6777; }
    .h { font-size: 14px; font-weight: 600; fill: #1d2733; }
    .h2 { font-size: 13px; font-weight: 600; fill: #1d2733; }
    .d { font-size: 12px; fill: #37414f; }
    .m { font-size: 12px; fill: #37414f; font-family: Consolas, 'Courier New', monospace; }
    .l { font-size: 11px; fill: #37414f; }
    .bl { font-size: 13px; font-weight: 600; fill: #5b6777; }
    .ln { fill: none; stroke: #5b6777; stroke-width: 1.5; }
    .lb { fill: #ffffff; }
    .proc { fill: #e8f0fb; stroke: #1f5fad; stroke-width: 1.5; }
    .child { fill: #f1eafb; stroke: #6a3fb4; stroke-width: 1.5; }
    .vol { fill: #f4f6fa; stroke: #5b6777; stroke-width: 1.5; }
    .svc { fill: #e0f2f1; stroke: #00796b; stroke-width: 1.5; }
    .ext { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
    .bnd { fill: none; stroke: #5b6777; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6777"/>
    </marker>
  </defs>
  <rect width="1200" height="880" rx="16" fill="#ffffff"/>
  <text x="32" y="44" class="t">Agent container (cw-agent-&lt;id&gt;)</text>
  <text x="32" y="66" class="st">One Node.js process plus one supervised child process; all persistent state lives on the /home volume.</text>

  <!-- Container boundary -->
  <rect class="bnd" x="30" y="86" width="780" height="770" rx="12"/>
  <text x="46" y="108" class="bl">container cw-agent-&lt;id&gt; · image coworking/agent · port 8080</text>

  <!-- Node process boundary -->
  <rect class="bnd" x="50" y="124" width="740" height="366" rx="10"/>
  <text x="66" y="146" class="bl">Node.js process (agent-server)</text>

  <!-- Workspace & Git -->
  <rect class="proc" x="70" y="160" width="310" height="140" rx="10"/>
  <text x="86" y="186" class="h">Workspace &amp; Git</text>
  <text x="86" y="210" class="d">path safety for every file access</text>
  <text x="86" y="228" class="d">commits with audit trailers</text>
  <text x="86" y="246" class="d">checkpoints, reverts, audit export</text>
  <text x="86" y="264" class="d">timeline (decoded history mapping)</text>

  <!-- API / BFF -->
  <rect class="proc" x="420" y="160" width="350" height="140" rx="10"/>
  <text x="436" y="186" class="h">API / BFF (Express) :8080</text>
  <text x="436" y="210" class="d">agent web UI, REST API, SSE live events</text>
  <text x="436" y="228" class="d">OIDC relying party, JWE session cookie</text>
  <text x="436" y="246" class="d">role checks (Agent.User / Approver / Admin)</text>
  <text x="436" y="264" class="d">Temporal client: start, update, signal, query</text>

  <!-- Harness supervisor -->
  <rect class="proc" x="70" y="330" width="310" height="140" rx="10"/>
  <text x="86" y="356" class="h">Harness supervisor</text>
  <text x="86" y="380" class="d">writes opencode config outside</text>
  <text x="86" y="398" class="d">the workspace (provider = AI gateway)</text>
  <text x="86" y="416" class="d">spawns the child, waits until healthy,</text>
  <text x="86" y="434" class="d">restarts it on failure</text>

  <!-- Temporal worker -->
  <rect class="proc" x="420" y="330" width="350" height="140" rx="10"/>
  <text x="436" y="356" class="h">Temporal worker</text>
  <text x="436" y="378" class="d">task queue agent-&lt;id&gt;</text>
  <text x="436" y="396" class="d">workflows: AgentWorkflow, TaskWorkflow,</text>
  <text x="436" y="414" class="d">MaintenanceWorkflow</text>
  <text x="436" y="432" class="d">activities: runAgentStep, verify, applyUpload,</text>
  <text x="436" y="450" class="d">finalizeTask, notify, maintenance</text>

  <!-- internal arrows -->
  <path class="ln" d="M420,200 H382" marker-end="url(#arr3)"/>
  <path class="ln" d="M420,400 H400 V270 H382" marker-end="url(#arr3)"/>
  <path class="ln" d="M225,470 V538" marker-end="url(#arr3)"/>
  <rect class="lb" x="233" y="497" width="128" height="14"/>
  <text x="237" y="508" class="l">spawn · health · restart</text>
  <path class="ln" d="M600,470 V538" marker-end="url(#arr3)"/>
  <rect class="lb" x="608" y="497" width="166" height="14"/>
  <text x="612" y="508" class="l">HTTP + SSE, password (step)</text>

  <!-- Harness child -->
  <rect class="child" x="50" y="540" width="740" height="76" rx="10"/>
  <text x="66" y="566" class="h">Agent Harness — child process: opencode serve</text>
  <text x="66" y="588" class="d">listens on 127.0.0.1:4096 only (not reachable from outside the container) · password auth · executes the plan steps</text>
  <text x="66" y="606" class="d">tools work inside workspace/ · config and data kept outside the workspace</text>

  <!-- /home volume -->
  <rect class="vol" x="50" y="656" width="740" height="184" rx="10"/>
  <text x="66" y="828" class="h">/home — named volume cw-agent-&lt;id&gt;-home</text>
  <rect x="66" y="668" width="230" height="128" rx="8" fill="#ffffff" stroke="#5b6777" stroke-width="1.2"/>
  <text x="80" y="690" class="m" font-weight="600">workspace/</text>
  <text x="80" y="710" class="d">Git repo, single shared data set</text>
  <text x="80" y="730" class="m">.agent/plans/</text>
  <text x="80" y="748" class="m">.agent/summaries/</text>
  <text x="80" y="766" class="m">.agent/steps/</text>
  <text x="80" y="784" class="m">.agent/audit/yyyy/mm/</text>
  <rect x="306" y="668" width="200" height="128" rx="8" fill="#ffffff" stroke="#5b6777" stroke-width="1.2"/>
  <text x="320" y="690" class="m" font-weight="600">artifacts/</text>
  <text x="320" y="710" class="d">harness transcripts</text>
  <text x="320" y="728" class="d">verify reports</text>
  <text x="320" y="746" class="d">app audit log (JSONL)</text>
  <text x="320" y="764" class="d">notifications</text>
  <rect x="516" y="668" width="126" height="128" rx="8" fill="#ffffff" stroke="#5b6777" stroke-width="1.2"/>
  <text x="530" y="690" class="m" font-weight="600">staging/</text>
  <text x="530" y="710" class="d">uploads before</text>
  <text x="530" y="728" class="d">applyUpload</text>
  <rect x="652" y="668" width="124" height="128" rx="8" fill="#ffffff" stroke="#5b6777" stroke-width="1.2"/>
  <text x="666" y="690" class="m" font-weight="600">.oc/</text>
  <text x="666" y="710" class="d">harness data</text>
  <text x="666" y="728" class="d">(sessions)</text>

  <path class="ln" d="M180,616 V666" marker-end="url(#arr3)"/>
  <rect class="lb" x="188" y="634" width="68" height="14"/>
  <text x="192" y="645" class="l">edits files</text>
  <path class="ln" d="M714,616 V666" marker-end="url(#arr3)"/>

  <!-- External dependencies -->
  <text x="860" y="108" class="bl">External dependencies</text>
  <rect class="child" x="860" y="160" width="310" height="60" rx="10"/>
  <text x="876" y="184" class="h">Browser (Anna, Ben, Clara)</text>
  <text x="876" y="204" class="d">http://localhost:81xx → container 8080</text>

  <rect class="svc" x="860" y="240" width="310" height="60" rx="10"/>
  <text x="876" y="264" class="h">OAuth server</text>
  <text x="876" y="284" class="d">http://oauth:9000 (issuer: public URL)</text>

  <rect class="svc" x="860" y="330" width="310" height="140" rx="10"/>
  <text x="876" y="356" class="h">Temporal server</text>
  <text x="876" y="378" class="d">temporal:7233 (gRPC)</text>
  <text x="876" y="396" class="d">namespace agent-dev</text>
  <text x="876" y="414" class="d">payloads AES-256-GCM encrypted</text>
  <text x="876" y="432" class="d">by the shared codec key ring</text>

  <rect class="ext" x="860" y="540" width="310" height="76" rx="10"/>
  <text x="876" y="566" class="h">AI gateway</text>
  <text x="876" y="586" class="d">AI_GATEWAY_BASE_URL (OpenAI API)</text>
  <text x="876" y="604" class="d">locally http://mock-llm:4010/v1</text>

  <path class="ln" d="M860,190 H772" marker-end="url(#arr3)"/>
  <rect class="lb" x="796" y="173" width="44" height="13"/>
  <text x="818" y="183" class="l" text-anchor="middle">HTTP</text>
  <path class="ln" d="M770,270 H858" marker-end="url(#arr3)"/>
  <rect class="lb" x="784" y="253" width="66" height="13"/>
  <text x="817" y="263" class="l" text-anchor="middle">token, JWKS</text>
  <path class="ln" d="M770,290 H830 V350 H858" marker-end="url(#arr3)"/>
  <rect class="lb" x="784" y="312" width="44" height="13"/>
  <text x="806" y="322" class="l" text-anchor="middle">client</text>
  <path class="ln" d="M770,420 H858" marker-end="url(#arr3)"/>
  <rect class="lb" x="784" y="403" width="66" height="13"/>
  <text x="817" y="413" class="l" text-anchor="middle">poll queue</text>
  <path class="ln" d="M790,578 H858" marker-end="url(#arr3)"/>
  <rect class="lb" x="800" y="561" width="48" height="13"/>
  <text x="824" y="571" class="l" text-anchor="middle">LLM</text>

  <!-- Legend -->
  <g transform="translate(860,680)">
    <text x="0" y="0" class="bl">Legend</text>
    <rect x="0" y="14" width="16" height="16" rx="4" class="proc"/>
    <text x="24" y="27" class="d">module of the Node process</text>
    <rect x="0" y="40" width="16" height="16" rx="4" class="child"/>
    <text x="24" y="53" class="d">child process / user agent</text>
    <rect x="0" y="66" width="16" height="16" rx="4" class="vol"/>
    <text x="24" y="79" class="d">persistent volume</text>
    <rect x="0" y="92" width="16" height="16" rx="4" class="svc"/>
    <text x="24" y="105" class="d">platform service (other container)</text>
    <rect x="0" y="118" width="16" height="16" rx="4" class="ext"/>
    <text x="24" y="131" class="d">external model provider</text>
  </g>
</svg>
