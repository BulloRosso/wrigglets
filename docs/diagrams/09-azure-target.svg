<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <title>Azure target architecture</title>
  <style>
    .t { font-size: 22px; font-weight: 600; fill: #1d2733; }
    .st { font-size: 13px; fill: #5b6777; }
    .h { font-size: 14px; font-weight: 600; fill: #1d2733; }
    .h2 { font-size: 13px; font-weight: 600; fill: #1d2733; }
    .d { font-size: 12px; fill: #37414f; }
    .l { font-size: 11px; fill: #37414f; }
    .bl { font-size: 13px; font-weight: 600; fill: #5b6777; }
    .bl2 { font-size: 12px; font-weight: 600; fill: #5b6777; }
    .ln { fill: none; stroke: #5b6777; stroke-width: 1.5; }
    .lb { fill: #ffffff; }
    .app { fill: #e8f0fb; stroke: #1f5fad; stroke-width: 1.5; }
    .aca { fill: #e0f2f1; stroke: #00796b; stroke-width: 1.5; }
    .data { fill: #f4f6fa; stroke: #5b6777; stroke-width: 1.5; }
    .idn { fill: #f1eafb; stroke: #6a3fb4; stroke-width: 1.5; }
    .ext { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
    .mon { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; }
    .opt { fill: #ffffff; stroke: #5b6777; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .bnd { fill: none; stroke: #5b6777; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .sub { fill: none; stroke: #8a96a6; stroke-width: 1.2; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="arr9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6777"/>
    </marker>
  </defs>
  <rect width="1200" height="940" rx="16" fill="#ffffff"/>
  <text x="32" y="44" class="t">Azure target architecture (proposed)</text>
  <text x="32" y="66" class="st">Same images as locally; one Web App per agent, Temporal on Container Apps + PostgreSQL, everything private inside one VNet (ADR-0003, 0019, 0020).</text>
  <rect class="ext" x="30" y="92" width="290" height="78" rx="10"/>
  <text x="42" y="113" class="h">GitHub Actions (CI)</text>
  <text x="42" y="132" class="d">builds the images, pushes</text>
  <text x="42" y="149" class="d">versioned tags to ACR</text>
  <rect class="idn" x="360" y="92" width="260" height="78" rx="10"/>
  <text x="372" y="113" class="h">Users (browser)</text>
  <text x="372" y="132" class="d">Anna, Ben, Clara, platform admins</text>
  <text x="372" y="149" class="d">HTTPS</text>
  <rect class="idn" x="650" y="92" width="250" height="78" rx="10"/>
  <text x="662" y="113" class="h">Microsoft Entra ID</text>
  <text x="662" y="132" class="d">app registrations, app roles</text>
  <text x="662" y="149" class="d">(replaces the local OAuth server)</text>
  <rect class="ext" x="930" y="92" width="240" height="78" rx="10"/>
  <text x="942" y="113" class="h">AI gateway</text>
  <text x="942" y="132" class="d">model API (OpenAI-compatible)</text>
  <text x="942" y="149" class="d">reached privately</text>
  <rect class="bnd" x="16" y="196" width="1168" height="728" rx="12"/>
  <text x="1168" y="218" class="bl" text-anchor="end">Resource group rg-coworking-&lt;env&gt; (one per environment)</text>
  <rect class="data" x="30" y="236" width="290" height="80" rx="10"/>
  <text x="42" y="257" class="h">Azure Container Registry</text>
  <text x="42" y="276" class="d">private, Premium · coworking/agent,</text>
  <text x="42" y="293" class="d">control-plane, oauth · AcrPull (MI)</text>
  <rect class="data" x="30" y="330" width="290" height="150" rx="10"/>
  <text x="42" y="351" class="h">Private DNS zones</text>
  <text x="42" y="370" class="d">privatelink.vaultcore.azure.net</text>
  <text x="42" y="387" class="d">privatelink.blob.core.windows.net</text>
  <text x="42" y="404" class="d">privatelink.azurecr.io</text>
  <text x="42" y="421" class="d">privatelink.postgres.database.azure.com</text>
  <text x="42" y="438" class="d">Container Apps env domain</text>
  <text x="42" y="455" class="d">all linked to the VNet</text>
  <rect class="data" x="30" y="606" width="290" height="72" rx="10"/>
  <text x="42" y="627" class="h">Key Vault</text>
  <text x="42" y="646" class="d">secrets, codec keys, mTLS certs</text>
  <text x="42" y="663" class="d">used via Key Vault references</text>
  <rect class="data" x="30" y="690" width="290" height="72" rx="10"/>
  <text x="42" y="711" class="h">Storage account</text>
  <text x="42" y="730" class="d">Blob: workspace backups (git bundles)</text>
  <text x="42" y="747" class="d">lifecycle rule: delete after 35 days</text>
  <rect class="bnd" x="350" y="236" width="820" height="520" rx="12"/>
  <text x="366" y="258" class="bl">Virtual Network</text>
  <rect class="sub" x="366" y="272" width="394" height="230" rx="8"/>
  <text x="378" y="290" class="bl2">snet-app (VNet integration)</text>
  <rect class="sub" x="776" y="272" width="378" height="230" rx="8"/>
  <text x="788" y="290" class="bl2">snet-aca (internal environment)</text>
  <rect class="sub" x="366" y="518" width="394" height="226" rx="8"/>
  <text x="378" y="536" class="bl2">snet-pe (private endpoints)</text>
  <rect class="sub" x="776" y="518" width="378" height="226" rx="8"/>
  <text x="900" y="536" class="bl2">snet-pg (delegated to PostgreSQL)</text>
  <rect class="app" x="382" y="300" width="362" height="190" rx="10"/>
  <text x="394" y="321" class="h">App Service plan (Linux, B2, Always On)</text>
  <rect x="396" y="334" width="334" height="68" rx="8" fill="#ffffff" stroke="#1f5fad" stroke-width="1.2"/>
  <text x="408" y="354" class="h2">Web App for Containers · agent-max</text>
  <text x="408" y="372" class="d">coworking/agent from ACR · /home = App Service</text>
  <text x="408" y="390" class="d">storage · EasyAuth (Entra ID) or OIDC</text>
  <rect x="396" y="410" width="334" height="68" rx="8" fill="#ffffff" stroke="#1f5fad" stroke-width="1.2"/>
  <text x="408" y="430" class="h2">Web App for Containers · agent-eva</text>
  <text x="408" y="448" class="d">coworking/agent from ACR · /home = App Service</text>
  <text x="408" y="466" class="d">storage · EasyAuth (Entra ID) or OIDC</text>
  <rect class="aca" x="792" y="300" width="346" height="190" rx="10"/>
  <text x="804" y="321" class="h">Container Apps environment</text>
  <rect x="804" y="332" width="130" height="148" rx="8" fill="#ffffff" stroke="#00796b" stroke-width="1.2"/>
  <text x="814" y="352" class="h2">Temporal server</text>
  <text x="814" y="372" class="d">Container App</text>
  <text x="814" y="389" class="d">temporalio/server</text>
  <text x="814" y="406" class="d">TCP ingress 7233</text>
  <text x="814" y="423" class="d">mTLS (certs from</text>
  <text x="814" y="440" class="d">Key Vault)</text>
  <rect x="942" y="332" width="186" height="46" rx="8" fill="#ffffff" stroke="#00796b" stroke-width="1.2"/>
  <text x="952" y="350" class="h2">Temporal Web UI</text>
  <text x="952" y="367" class="l">Container App · Entra auth</text>
  <rect x="942" y="382" width="186" height="46" rx="8" fill="#ffffff" stroke="#00796b" stroke-width="1.2"/>
  <text x="952" y="400" class="h2">Admin console</text>
  <text x="952" y="417" class="l">Container App · control plane</text>
  <rect x="942" y="432" width="186" height="46" rx="8" fill="#ffffff" stroke="#00796b" stroke-width="1.2"/>
  <text x="952" y="450" class="h2">Schema job</text>
  <text x="952" y="467" class="l">Container Apps job (admin-tools)</text>
  <rect class="data" x="382" y="556" width="362" height="50" rx="8"/>
  <text x="396" y="586" class="h2">Private endpoint → Container Registry</text>
  <rect class="data" x="382" y="618" width="362" height="50" rx="8"/>
  <text x="396" y="648" class="h2">Private endpoint → Key Vault</text>
  <rect class="data" x="382" y="680" width="362" height="50" rx="8"/>
  <text x="396" y="710" class="h2">Private endpoint → Storage (blob)</text>
  <rect class="data" x="792" y="556" width="346" height="170" rx="10"/>
  <text x="804" y="577" class="h">Azure Database for PostgreSQL</text>
  <text x="804" y="596" class="d">Flexible Server · Burstable B2s to start</text>
  <text x="804" y="614" class="d">private access, TLS</text>
  <text x="804" y="632" class="d">databases: temporal, temporal_visibility</text>
  <text x="804" y="650" class="d">credentials from Key Vault</text>
  <text x="804" y="668" class="d">schema created by the schema job</text>
  <rect class="mon" x="30" y="790" width="290" height="72" rx="10"/>
  <text x="42" y="811" class="h">Log Analytics workspace</text>
  <text x="42" y="830" class="d">logs of all resources (diagnostic</text>
  <text x="42" y="847" class="d">settings, Container Apps logs)</text>
  <rect class="mon" x="350" y="790" width="290" height="72" rx="10"/>
  <text x="362" y="811" class="h">Application Insights</text>
  <text x="362" y="830" class="d">agent telemetry (traces, metrics)</text>
  <text x="362" y="847" class="d">workspace-based</text>
  <rect class="opt" x="670" y="790" width="500" height="72" rx="10"/>
  <text x="682" y="811" class="h">Optional: Front Door / Application Gateway</text>
  <text x="682" y="830" class="d">public entry with WAF in front of the Web Apps;</text>
  <text x="682" y="847" class="d">otherwise access via corporate network / VPN</text>
  <path class="ln" d="M175,170 V234" marker-end="url(#arr9)"/>
  <rect class="lb" x="178" y="199" width="75" height="14"/>
  <text x="182" y="210" class="l" text-anchor="start">docker push</text>
  <path class="ln" d="M600,170 V298" marker-end="url(#arr9)"/>
  <rect class="lb" x="540" y="225" width="40" height="14"/>
  <text x="560" y="236" class="l" text-anchor="middle">HTTPS</text>
  <path class="ln" d="M690,170 V298" marker-end="url(#arr9)"/>
  <rect class="lb" x="635" y="225" width="51" height="14"/>
  <text x="682" y="236" class="l" text-anchor="end">sign-in</text>
  <path class="ln" d="M735,300 V184 H1050 V172" marker-end="url(#arr9)"/>
  <rect class="lb" x="812" y="173" width="175" height="14"/>
  <text x="900" y="184" class="l" text-anchor="middle">model calls (VNet route-all)</text>
  <path class="ln" d="M744,372 H802" marker-end="url(#arr9)"/>
  <rect class="lb" x="741" y="349" width="63" height="14"/>
  <text x="773" y="360" class="l" text-anchor="middle">gRPC 7233</text>
  <path class="ln" d="M882,480 V554" marker-end="url(#arr9)"/>
  <rect class="lb" x="815" y="501" width="63" height="14"/>
  <text x="874" y="512" class="l" text-anchor="end">SQL (TLS)</text>
  <path class="ln" d="M563,490 V554" marker-end="url(#arr9)"/>
  <rect class="lb" x="567" y="501" width="175" height="14"/>
  <text x="571" y="512" class="l" text-anchor="start">image pull, KV refs, backups</text>
  <path class="ln" d="M382,581 H336 V276 H322" marker-end="url(#arr9)"/>
  <path class="ln" d="M382,643 H322" marker-end="url(#arr9)"/>
  <path class="ln" d="M382,705 H322" marker-end="url(#arr9)"/>
  <g transform="translate(30,884)">
    <rect x="0" y="0" width="16" height="16" rx="4" class="app"/><text x="24" y="13" class="d">App Service</text>
    <rect x="120" y="0" width="16" height="16" rx="4" class="aca"/><text x="144" y="13" class="d">Container Apps</text>
    <rect x="260" y="0" width="16" height="16" rx="4" class="data"/><text x="284" y="13" class="d">data / registry / networking</text>
    <rect x="470" y="0" width="16" height="16" rx="4" class="mon"/><text x="494" y="13" class="d">monitoring</text>
    <rect x="590" y="0" width="16" height="16" rx="4" class="idn"/><text x="614" y="13" class="d">people / identity</text>
    <rect x="740" y="0" width="16" height="16" rx="4" class="ext"/><text x="764" y="13" class="d">external</text>
    <rect x="840" y="0" width="28" height="16" rx="3" class="bnd"/><text x="876" y="13" class="d">resource group / VNet</text>
    <rect x="1020" y="0" width="28" height="16" rx="3" class="sub"/><text x="1056" y="13" class="d">subnet</text>
  </g>
</svg>
