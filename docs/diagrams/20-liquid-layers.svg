<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <title>Liquid Enterprise: layers on top of the agent platform</title>
  <style>
    .t { font-size: 22px; font-weight: 600; fill: #1d2733; }
    .st { font-size: 13px; fill: #5b6777; }
    .h { font-size: 15px; font-weight: 600; fill: #1d2733; }
    .d { font-size: 12px; fill: #37414f; }
    .tag { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .lbl { font-size: 11px; fill: #37414f; }
    .ln { fill: none; stroke: #5b6777; stroke-width: 1.5; }
    .ln2 { fill: none; stroke: #00796b; stroke-width: 2; }
    .lnr { fill: none; stroke: #c62828; stroke-width: 2; stroke-dasharray: 6 4; }
    .core { fill: #e8f0fb; stroke: #1f5fad; stroke-width: 1.5; }
    .repl { fill: #f4f6fa; stroke: #5b6777; stroke-width: 1.5; }
    .ag { fill: #e0f2f1; stroke: #00796b; stroke-width: 1.5; }
    .gov { fill: #fdecea; stroke: #c62828; stroke-width: 1.5; }
    .loop { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
    .bnd { fill: none; stroke: #5b6777; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .core-b { fill: #1f5fad; }
    .repl-b { fill: #5b6777; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6777"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00796b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="44" class="t">Liquid Enterprise: what is owned, what is replaceable</text>
  <text x="40" y="68" class="st">Everything above the ontology talks to the ontology only. Every change to business data is a typed action. Rules are code, desired state is Git.</text>

  <!-- consumers (replaceable) -->
  <rect x="40" y="96" width="250" height="92" rx="10" class="repl"/>
  <text x="60" y="124" class="h">Small UIs</text>
  <text x="60" y="146" class="d">generated SDK, app registry,</text>
  <text x="60" y="164" class="d">expiry date (M9)</text>
  <rect x="320" y="96" width="250" height="92" rx="10" class="ag"/>
  <text x="340" y="124" class="h">Agents</text>
  <text x="340" y="146" class="d">existing agent containers,</text>
  <text x="340" y="164" class="d">skills, memory, approvals</text>
  <rect x="600" y="96" width="250" height="92" rx="10" class="repl"/>
  <text x="620" y="124" class="h">Business workflows</text>
  <text x="620" y="146" class="d">Temporal namespace business,</text>
  <text x="620" y="164" class="d">holdable, versioned (M5)</text>
  <rect x="1010" y="100" width="150" height="26" rx="13" class="repl-b"/>
  <text x="1085" y="118" class="tag">REPLACEABLE</text>
  <text x="1010" y="146" class="lbl">behind a contract;</text>
  <text x="1010" y="162" class="lbl">disposable UIs</text>

  <!-- gateway -->
  <rect x="320" y="222" width="530" height="64" rx="10" class="gov"/>
  <text x="340" y="248" class="h">MCP gateway</text>
  <text x="340" y="270" class="d">only tool path · allow-lists · kill switch · audit · embedded policy (WASM)</text>
  <path d="M445,188 L445,220" class="ln" marker-end="url(#a)"/>
  <path d="M165,188 L165,330" class="ln" marker-end="url(#a)"/>
  <text x="174" y="262" class="lbl">REST + OIDC (SDK)</text>
  <path d="M725,188 L725,220" class="ln" marker-end="url(#a)"/>
  <text x="735" y="208" class="lbl">activities</text>

  <!-- ontology server -->
  <rect x="40" y="332" width="810" height="112" rx="10" class="core"/>
  <text x="60" y="360" class="h">Ontology server — the only write path (M3)</text>
  <text x="60" y="384" class="d">validate (generated zod) → load objects → preconditions → object policy (embedded WASM) → handler → one transaction:</text>
  <text x="60" y="402" class="d">append events + update projection → start/signal workflows (outbox). Read-only actions never write.</text>
  <text x="60" y="426" class="d">MCP tools /onto, /erp, /crm and REST /objects, /actions — all generated from the ontology.</text>
  <path d="M585,286 L585,330" class="ln" marker-end="url(#a)"/>
  <text x="594" y="314" class="lbl">tools onto__*, erp__*, crm__*</text>

  <!-- ontology source -->
  <rect x="40" y="478" width="390" height="118" rx="10" class="core"/>
  <text x="60" y="506" class="h">Ontology (M2)</text>
  <text x="60" y="528" class="d">LinkML schema + actions.yaml + bindings.yaml</text>
  <text x="60" y="548" class="d">→ compiler → IR, interpreted at runtime: tools, SQL,</text>
  <text x="60" y="566" class="d">policy data, DQ checks; generated: types, SDK</text>
  <text x="60" y="584" class="d">edited in the React Flow editor (E1–E4)</text>

  <rect x="460" y="478" width="390" height="118" rx="10" class="core"/>
  <text x="480" y="506" class="h">Event log, projection, lake (M1)</text>
  <text x="480" y="528" class="d">events: append-only (Postgres)</text>
  <text x="480" y="548" class="d">projection: cache, rebuildable from events</text>
  <text x="480" y="566" class="d">raw zone: Iceberg tables in object storage,</text>
  <text x="480" y="584" class="d">queried with DuckDB</text>
  <path d="M235,444 L235,476" class="ln" marker-start="url(#a)"/>
  <text x="244" y="466" class="lbl">loads generated artefacts</text>
  <path d="M655,444 L655,476" class="ln2" marker-end="url(#g)"/>
  <text x="664" y="466" class="lbl">events + projection</text>

  <rect x="1010" y="336" width="150" height="26" rx="13" class="core-b"/>
  <text x="1085" y="354" class="tag">OWNED CORE</text>
  <text x="1010" y="382" class="lbl">open formats,</text>
  <text x="1010" y="398" class="lbl">versioned, compiled</text>
  <text x="1010" y="414" class="lbl">everywhere</text>

  <!-- control loop -->
  <rect x="40" y="634" width="810" height="96" rx="10" class="loop"/>
  <text x="60" y="662" class="h">Control loop (M6–M8): config repository + playbooks + shadow replay</text>
  <text x="60" y="686" class="d">sense (safety metrics, alerts, signals) → decide (playbook, blast radius from the ontology) → act with autonomy tiers.</text>
  <text x="60" y="706" class="d">Tighten automatically (disable upstream, policy overlay, hold workflows); loosen only after a human approves.</text>

  <!-- feedback arrows from control loop -->
  <path d="M880,682 L940,682 L940,254 L852,254" class="lnr" marker-end="url(#r)"/>
  <path d="M940,388 L852,388" class="lnr" marker-end="url(#r)"/>
  <path d="M940,142 L852,142" class="lnr" marker-end="url(#r)"/>
  <path d="M850,682 L880,682" class="lnr"/>
  <text x="948" y="560" class="lbl">tighten / propose</text>
  <text x="948" y="576" class="lbl">(Git proposals,</text>
  <text x="948" y="592" class="lbl">human approval</text>
  <text x="948" y="608" class="lbl">to loosen)</text>
</svg>
