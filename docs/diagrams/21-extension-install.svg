<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <title>Installing an extension from the admin console</title>
  <style>
    .t { font-size: 22px; font-weight: 600; fill: #1d2733; }
    .st { font-size: 13px; fill: #5b6777; }
    .h { font-size: 15px; font-weight: 600; fill: #1d2733; }
    .d { font-size: 12px; fill: #37414f; }
    .mono { font-size: 11px; fill: #37414f; font-family: Consolas, monospace; }
    .lbl { font-size: 11px; fill: #37414f; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .ln { fill: none; stroke: #5b6777; stroke-width: 1.5; }
    .ln2 { fill: none; stroke: #00796b; stroke-width: 2; }
    .cp { fill: #e8f0fb; stroke: #1f5fad; stroke-width: 1.5; }
    .usr { fill: #f1eafb; stroke: #6a3fb4; stroke-width: 1.5; }
    .gw { fill: #fdecea; stroke: #c62828; stroke-width: 1.5; }
    .sup { fill: #f4f6fa; stroke: #5b6777; stroke-width: 1.5; }
    .ext { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
    .bnd { fill: none; stroke: #5b6777; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .bd { fill: #1d2733; }
    .stp { fill: #ffffff; stroke: #1f5fad; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6777"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00796b"/></marker>
  </defs>
  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="40" y="44" class="t">Installing an extension from the admin console (ADR-0039)</text>
  <text x="40" y="68" class="st">The control plane uses the Docker socket it already holds for agent containers. Every step is idempotent and persisted, so a restart resumes the install.</text>

  <!-- admin -->
  <rect x="40" y="100" width="220" height="120" rx="10" class="usr"/>
  <text x="60" y="128" class="h">Platform admin</text>
  <text x="60" y="150" class="d">Extensions page:</text>
  <text x="60" y="168" class="d">Install · Retry · Repair ·</text>
  <text x="60" y="186" class="d">Uninstall (purge data)</text>
  <text x="60" y="206" class="lbl">progress polled every 1.5 s</text>
  <path d="M262,160 L328,160" class="ln" marker-end="url(#a)"/>
  <text x="268" y="150" class="lbl">POST /api</text>
  <text x="268" y="178" class="lbl">/extensions</text>

  <!-- control plane -->
  <rect x="330" y="96" width="520" height="350" rx="12" class="cp"/>
  <text x="350" y="124" class="h">Control plane (admin server, container "temporal")</text>
  <text x="350" y="146" class="d">ExtensionService: manifest + persisted state machine</text>
  <text x="350" y="164" class="mono">not_installed → installing → installed | failed → uninstalling</text>

  <g>
    <rect x="350" y="180" width="480" height="30" rx="6" class="stp"/>
    <circle cx="368" cy="195" r="10" class="bd"/><text x="368" y="199" class="num">1</text>
    <text x="386" y="199" class="d">preflight: Docker reachable, images present / pulled, upstream names free</text>
    <rect x="350" y="216" width="480" height="30" rx="6" class="stp"/>
    <circle cx="368" cy="231" r="10" class="bd"/><text x="368" y="235" class="num">2</text>
    <text x="386" y="235" class="d">secrets: generated once, kept on retry</text>
    <rect x="350" y="252" width="480" height="30" rx="6" class="stp"/>
    <circle cx="368" cy="267" r="10" class="bd"/><text x="368" y="271" class="num">3</text>
    <text x="386" y="271" class="d">volumes: cw-ext-&lt;ext&gt;-&lt;volume&gt;</text>
    <rect x="350" y="288" width="480" height="30" rx="6" class="stp"/>
    <circle cx="368" cy="303" r="10" class="bd"/><text x="368" y="307" class="num">4</text>
    <text x="386" y="307" class="d">service:&lt;name&gt; in dependency order — create if fingerprint changed, wait healthy</text>
    <rect x="350" y="324" width="480" height="30" rx="6" class="stp"/>
    <circle cx="368" cy="339" r="10" class="bd"/><text x="368" y="343" class="num">5</text>
    <text x="386" y="343" class="d">bootstrap:&lt;id&gt; — migrations, namespace, demo seed (optional)</text>
    <rect x="350" y="360" width="480" height="30" rx="6" class="stp"/>
    <circle cx="368" cy="375" r="10" class="bd"/><text x="368" y="379" class="num">6</text>
    <text x="386" y="379" class="d">upstreams: register the gateway upstreams the extension owns</text>
  </g>
  <text x="350" y="416" class="d">Availability = installed and every service running.</text>
  <text x="350" y="434" class="d">Extension routes answer 404 otherwise; the nav group is hidden.</text>

  <!-- data files -->
  <rect x="40" y="260" width="250" height="186" rx="10" class="sup"/>
  <text x="60" y="288" class="h">DATA_DIR/admin</text>
  <text x="60" y="312" class="mono">extensions.json</text>
  <text x="60" y="330" class="d">phase, steps, owned upstreams</text>
  <text x="60" y="356" class="mono">extensions-secrets.json</text>
  <text x="60" y="374" class="d">mode 0600, never in logs</text>
  <text x="60" y="400" class="mono">audit.jsonl</text>
  <text x="60" y="418" class="d">extension.install / .done /</text>
  <text x="60" y="434" class="d">.failed / .uninstall</text>
  <path d="M328,330 L292,330" class="ln" marker-end="url(#a)"/>

  <!-- key vault + gateway -->
  <rect x="900" y="100" width="260" height="96" rx="10" class="sup"/>
  <text x="920" y="128" class="h">Key Vault</text>
  <text x="920" y="150" class="mono">ext-&lt;ext&gt;-&lt;secret&gt;</text>
  <text x="920" y="170" class="d">upstream credential, used by</text>
  <text x="920" y="186" class="d">the gateway via secretRef</text>
  <path d="M852,231 L880,231 L880,150 L898,150" class="ln" marker-end="url(#a)"/>

  <rect x="900" y="230" width="260" height="96" rx="10" class="gw"/>
  <text x="920" y="258" class="h">MCP gateway</text>
  <text x="920" y="280" class="d">upstream e.g. "onto" → http://</text>
  <text x="920" y="296" class="d">ontology-server:7700/mcp; removed</text>
  <text x="920" y="312" class="d">again on uninstall</text>
  <path d="M852,375 L880,375 L880,280 L898,280" class="ln" marker-end="url(#a)"/>

  <!-- docker -->
  <path d="M590,448 L590,486" class="ln2" marker-end="url(#g)"/>
  <text x="600" y="472" class="lbl">Docker socket (dockerode)</text>
  <rect x="40" y="490" width="1120" height="180" rx="12" class="bnd"/>
  <text x="60" y="516" class="h">Docker network "coworking"</text>
  <text x="60" y="536" class="d">containers carry cw.role=extension, cw.extension, cw.service, cw.spec (fingerprint); host name = service name; no host ports</text>

  <rect x="60" y="556" width="260" height="94" rx="10" class="ext"/>
  <text x="80" y="582" class="h">cw-ext-liquid-ontology-db</text>
  <text x="80" y="602" class="d">Postgres 17.6 · event log, projection,</text>
  <text x="80" y="620" class="d">lake catalog, dispatch cursor</text>

  <rect x="340" y="556" width="280" height="94" rx="10" class="ext"/>
  <text x="360" y="582" class="h">cw-ext-liquid-ontology-server</text>
  <text x="360" y="602" class="d">enterprise core: only write path, lake,</text>
  <text x="360" y="620" class="d">embedded policy, business worker</text>

  <rect x="640" y="556" width="240" height="94" rx="10" class="ext"/>
  <text x="660" y="582" class="h">cw-ext-liquid-forgejo</text>
  <text x="660" y="602" class="d">Git host of the config repository</text>
  <text x="660" y="620" class="d">(SQLite in its own volume)</text>

  <rect x="900" y="556" width="240" height="94" rx="10" class="cp" stroke-dasharray="5 4"/>
  <text x="920" y="582" class="h">in the control plane</text>
  <text x="920" y="602" class="d">ontology compiler (TypeScript),</text>
  <text x="920" y="620" class="d">OPA binary, job runner</text>
  <text x="920" y="638" class="lbl">no container (ADR-0053)</text>
</svg>
