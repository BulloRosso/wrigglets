<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <title>Playbooks: one sensing path, tighten automatically, loosen with a person</title>
  <style>
    .t { font-size: 22px; font-weight: 600; fill: #1d2733; }
    .st { font-size: 13px; fill: #5b6777; }
    .h { font-size: 15px; font-weight: 600; fill: #1d2733; }
    .h2 { font-size: 13px; font-weight: 600; fill: #1d2733; }
    .d { font-size: 12px; fill: #37414f; }
    .mono { font-size: 11px; fill: #37414f; font-family: Consolas, monospace; }
    .lbl { font-size: 11px; fill: #37414f; }
    .ln { fill: none; stroke: #5b6777; stroke-width: 1.6; }
    .lnb { fill: none; stroke: #1f5fad; stroke-width: 2; }
    .src { fill: #e0f2f1; stroke: #00796b; stroke-width: 1.5; }
    .ev { fill: #f4f6fa; stroke: #5b6777; stroke-width: 1.5; }
    .run { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
    .tight { fill: #fdecea; stroke: #c62828; stroke-width: 1.2; }
    .neut { fill: #ffffff; stroke: #5b6777; stroke-width: 1.2; }
    .loose { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.2; }
    .usr { fill: #f1eafb; stroke: #6a3fb4; stroke-width: 1.5; }
    .cp { fill: #e8f0fb; stroke: #1f5fad; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6777"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fad"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="44" class="t">Playbooks (M7): sense → decide → act, tighten automatically, loosen with a person</text>
  <text x="40" y="68" class="st">Every input is an event; matching playbooks start a durable run; the control plane executes steps; every step is an event.</text>

  <!-- sources -->
  <rect x="40" y="100" width="200" height="44" rx="8" class="src"/><text x="56" y="127" class="h2">Alert (vuln feed, console)</text>
  <rect x="40" y="154" width="200" height="44" rx="8" class="src"/><text x="56" y="181" class="h2">Safety rule tripped</text>
  <rect x="40" y="208" width="200" height="44" rx="8" class="src"/><text x="56" y="235" class="h2">Schedule tick</text>
  <rect x="40" y="262" width="200" height="44" rx="8" class="src"/><text x="56" y="289" class="h2">Signals / any event</text>

  <rect x="290" y="100" width="210" height="206" rx="12" class="ev"/>
  <text x="310" y="128" class="h">Event log</text>
  <text x="310" y="152" class="mono">AlertReceived</text>
  <text x="310" y="170" class="mono">SafetyRuleTripped</text>
  <text x="310" y="188" class="mono">ScheduleTick</text>
  <text x="310" y="214" class="lbl">→ match playbooks/*.yaml</text>
  <text x="310" y="232" class="lbl">  of the applied config revision</text>
  <text x="310" y="258" class="mono">PlaybookRunStarted</text>
  <text x="310" y="276" class="mono">PlaybookStepExecuted …</text>

  <path d="M240,122 L286,140" class="ln" marker-end="url(#a)"/>
  <path d="M240,176 L286,176" class="ln" marker-end="url(#a)"/>
  <path d="M240,230 L286,212" class="ln" marker-end="url(#a)"/>
  <path d="M240,284 L286,250" class="ln" marker-end="url(#a)"/>

  <!-- run -->
  <rect x="550" y="100" width="610" height="300" rx="12" class="run"/>
  <text x="570" y="128" class="h">PlaybookRun (Temporal, survives restarts) — third-party-upstream-vulnerability</text>
  <text x="570" y="150" class="lbl">assess: blast radius = upstream → tools → actions → classes → running workflows</text>
  <rect x="570" y="166" width="180" height="40" rx="6" class="tight"/><text x="582" y="184" class="h2">disable-upstream</text><text x="582" y="199" class="lbl">tighten · auto</text>
  <rect x="760" y="166" width="180" height="40" rx="6" class="tight"/><text x="772" y="184" class="h2">tighten-policy</text><text x="772" y="199" class="lbl">overlay four eyes · auto</text>
  <rect x="950" y="166" width="190" height="40" rx="6" class="tight"/><text x="962" y="184" class="h2">hold-workflows</text><text x="962" y="199" class="lbl">tighten · auto</text>
  <rect x="570" y="216" width="180" height="40" rx="6" class="neut"/><text x="582" y="234" class="h2">notify-owners</text><text x="582" y="249" class="lbl">neutral · auto</text>
  <rect x="760" y="216" width="180" height="40" rx="6" class="neut"/><text x="772" y="234" class="h2">propose-fix</text><text x="772" y="249" class="lbl">agent task · propose</text>
  <rect x="950" y="216" width="190" height="40" rx="6" class="neut"/><text x="962" y="234" class="h2">replay</text><text x="962" y="249" class="lbl">shadow replay 7 d · auto</text>
  <rect x="570" y="266" width="570" height="40" rx="6" class="loose"/><text x="582" y="284" class="h2">restore</text><text x="582" y="299" class="lbl">loosen · human: waits for decideStep, then reverts the undo data of this run, newest first</text>
  <text x="570" y="332" class="lbl">validator + control plane: a loosening step needs autonomy human and a person's approval</text>
  <text x="570" y="352" class="lbl">cancel: stops before the next step, loosens nothing</text>
  <text x="570" y="380" class="lbl">tightening is committed to the config repository → the reconciler keeps it</text>

  <path d="M500,200 L546,200" class="lnb" marker-end="url(#b)"/>

  <!-- executor -->
  <rect x="550" y="430" width="300" height="150" rx="12" class="cp"/>
  <text x="570" y="458" class="h">Control plane executes steps</text>
  <text x="570" y="482" class="lbl">gateway upstreams · policy overlays · holds</text>
  <text x="570" y="500" class="lbl">kill switch · allow-lists (Entra stand-in)</text>
  <text x="570" y="518" class="lbl">config proposals · agent task requests</text>
  <text x="570" y="544" class="lbl">ontology server: shadow replay</text>
  <text x="570" y="562" class="lbl">(event log replayed with the candidate)</text>
  <path d="M700,400 L700,426" class="lnb" marker-end="url(#b)"/>

  <rect x="880" y="430" width="280" height="150" rx="12" class="usr"/>
  <text x="900" y="458" class="h">Person (Playbooks page)</text>
  <text x="900" y="482" class="lbl">sees the timeline, the blast radius</text>
  <text x="900" y="500" class="lbl">and the replay report;</text>
  <text x="900" y="526" class="lbl">approves or rejects restore,</text>
  <text x="900" y="544" class="lbl">or cancels the run</text>
  <path d="M1020,430 L1020,410" class="ln" marker-end="url(#a)"/>

  <rect x="40" y="430" width="460" height="150" rx="12" class="ev"/>
  <text x="60" y="458" class="h">Safety rules (unchanged behaviour)</text>
  <text x="60" y="482" class="lbl">The safety engine still evaluates and raises the kill switch (ADR-0022);</text>
  <text x="60" y="500" class="lbl">each trip is additionally a SafetyRuleTripped event playbooks can</text>
  <text x="60" y="518" class="lbl">subscribe to. safetyRuleToPlaybook shows the same rule as a playbook:</text>
  <text x="60" y="536" class="lbl">same inputs, same levels (tested).</text>
</svg>
