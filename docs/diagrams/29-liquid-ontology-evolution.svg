<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <title>Ontology evolution: from proposal to live without a deploy</title>
  <style>
    .t { font-size: 22px; font-weight: 600; fill: #1d2733; }
    .st { font-size: 13px; fill: #5b6777; }
    .h { font-size: 15px; font-weight: 600; fill: #1d2733; }
    .h2 { font-size: 13px; font-weight: 600; fill: #1d2733; }
    .d { font-size: 12px; fill: #37414f; }
    .mono { font-size: 11px; fill: #37414f; font-family: Consolas, monospace; }
    .lbl { font-size: 11px; fill: #37414f; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .ln { fill: none; stroke: #5b6777; stroke-width: 1.6; }
    .ag { fill: #e0f2f1; stroke: #00796b; stroke-width: 1.5; }
    .git { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
    .cp { fill: #e8f0fb; stroke: #1f5fad; stroke-width: 1.5; }
    .usr { fill: #f1eafb; stroke: #6a3fb4; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.2; }
    .bad { fill: #fdecea; stroke: #c62828; stroke-width: 1.2; }
    .bd { fill: #1d2733; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6777"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="44" class="t">Ontology evolution (M8): a new version is new data, not new code</text>
  <text x="40" y="68" class="st">Validate → propose → approve → the reconciler applies the IR to the running ontology server; tools, DDL, checks and policy data follow.</text>

  <rect x="40" y="100" width="220" height="150" rx="10" class="ag"/>
  <text x="58" y="126" class="h">Modelling agent / editor</text>
  <circle cx="66" cy="150" r="10" class="bd"/><text x="66" y="154" class="num">1</text>
  <text x="84" y="154" class="mono">config__validate</text>
  <text x="84" y="172" class="lbl">compile, compatibility,</text>
  <text x="84" y="188" class="lbl">existing data, policy tests</text>
  <circle cx="66" cy="214" r="10" class="bd"/><text x="66" y="218" class="num">2</text>
  <text x="84" y="218" class="mono">config__propose_change</text>

  <rect x="300" y="100" width="250" height="150" rx="10" class="usr"/>
  <text x="318" y="126" class="h">Owner reviews</text>
  <text x="318" y="150" class="lbl">diff graph + compatibility class</text>
  <rect x="318" y="162" width="62" height="22" rx="5" class="ok"/><text x="328" y="177" class="lbl">patch</text>
  <rect x="388" y="162" width="62" height="22" rx="5" class="ok"/><text x="398" y="177" class="lbl">minor</text>
  <rect x="458" y="162" width="74" height="22" rx="5" class="bad"/><text x="466" y="177" class="lbl">major</text>
  <text x="318" y="206" class="lbl">major: migration note required</text>
  <circle cx="330" cy="230" r="10" class="bd"/><text x="330" y="234" class="num">3</text>
  <text x="348" y="234" class="d">approve → merge into main</text>

  <rect x="590" y="100" width="250" height="150" rx="10" class="git"/>
  <text x="608" y="126" class="h">Reconciler (control plane)</text>
  <circle cx="620" cy="150" r="10" class="bd"/><text x="620" y="154" class="num">4</text>
  <text x="638" y="154" class="d">ontology files changed?</text>
  <text x="638" y="172" class="lbl">compile (compiler service)</text>
  <text x="638" y="190" class="mono">POST /internal/ontology/apply</text>
  <text x="638" y="214" class="lbl">then: gateway drops its tool cache</text>

  <rect x="880" y="100" width="280" height="300" rx="10" class="cp"/>
  <text x="898" y="126" class="h">Ontology server (between two actions)</text>
  <circle cx="910" cy="150" r="10" class="bd"/><text x="910" y="154" class="num">5</text>
  <text x="928" y="154" class="d">additive → DDL in place</text>
  <text x="928" y="170" class="lbl">new tables, nullable columns, enum checks</text>
  <text x="928" y="192" class="d">breaking / history → rebuild</text>
  <text x="928" y="208" class="lbl">projection replayed from the events, swap</text>
  <text x="898" y="236" class="h2">computed from the IR in force:</text>
  <text x="898" y="256" class="lbl">MCP tools · input validation · DDL · DQ checks</text>
  <text x="898" y="272" class="lbl">OPA data · SDK (GET …/sdk)</text>
  <text x="898" y="298" class="h2">actions without code: generic</text>
  <text x="898" y="316" class="lbl">query · create · update · delete from the IR;</text>
  <text x="898" y="332" class="lbl">new objects/attributes as extension state, as events</text>
  <text x="898" y="358" class="lbl">ontology_versions: restart keeps the version</text>
  <text x="898" y="376" class="lbl">events carry ontology_version</text>

  <path d="M260,175 L296,175" class="ln" marker-end="url(#a)"/>
  <path d="M550,175 L586,175" class="ln" marker-end="url(#a)"/>
  <path d="M840,175 L876,175" class="ln" marker-end="url(#a)"/>

  <rect x="40" y="290" width="800" height="230" rx="10" fill="#f4f6fa" stroke="#5b6777" stroke-width="1.2"/>
  <text x="58" y="318" class="h">D3 change, end to end (verified)</text>
  <text x="58" y="344" class="mono">schema.yaml   + class Carrier { id, name }   + PurchaseOrder.carrier → Carrier   version 2.0.0 → 2.1.0</text>
  <text x="58" y="364" class="mono">actions.yaml  + list_carriers (query)  + create_carrier, assign_carrier (write, new events)</text>
  <text x="58" y="384" class="mono">roles         + procurement may write create_carrier, assign_carrier (gateway policy fails closed)</text>
  <text x="58" y="414" class="d">validate: minor · version ok · existing data fits · policy tests pass → proposal → approve</text>
  <text x="58" y="436" class="d">live ~1 s later: gateway offers onto__*_carrier, the agent creates a carrier, the projection has table + column,</text>
  <text x="58" y="454" class="d">events carry 2.1.0, the SDK contains Carrier, a rebuild equals the live projection.</text>
  <text x="58" y="484" class="d">Revert = breaking (major) with migration note: projection rebuilt without Carrier, tools gone, events kept.</text>
</svg>
